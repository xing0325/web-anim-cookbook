<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rive 滚动 scrub · SVG 描线 · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>

</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">B-scroll</div>
    <h1 class="cb-title">Rive 滚动 scrub · SVG 描线</h1>
    <div class="cb-tags">stroke-dashoffset · scrub</div>
  </div>
</header>
<main class="cb-stage">
<div class="d20-stage pin-stage" id="d20Stage" data-pin-state="start">
          <div class="pin-hint pin-hint-start is-start"><span>↓ 滚动把曲线画出来</span><span class="arrow"></span></div>
          <div class="pin-hint pin-hint-done is-done"><span>✓ 路径绘制完成 · 继续</span><span class="arrow"></span></div>
          <div class="d20-pin">
            <svg class="d20-svg" viewBox="0 0 600 320">
              <path id="d20Path" d="M30 280 Q60 80 200 160 Q340 240 380 120 Q420 20 500 100 Q560 160 570 60" fill="none" stroke="#d2ff00" stroke-width="3" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>
              <circle id="d20Dot" cx="30" cy="280" r="8" fill="#d2ff00"/>
            </svg>
            <div class="d20-info">
              <div class="d15-row"><span class="d15-k">progress</span><span class="d15-v" id="d20Prog">0%</span></div>
              <div class="d15-row"><span class="d15-k">stroke-dashoffset</span><span class="d15-v" id="d20Off">900</span></div>
              <div class="d15-row"><span class="d15-k">data-rive-scrolltrigger-start</span><span class="d15-v">"top bottom"</span></div>
              <div class="d15-row"><span class="d15-k">data-rive-scrolltrigger-end</span><span class="d15-v">"bottom center"</span></div>
            </div>
          </div>
        </div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo19svg</code></div>
</footer>
<script>
/* =================== DEMO 19 (svg scrub) · d20- ============ */
(function(){
  const stage = document.getElementById('d20Stage');
  if (!stage) return;
  const path = document.getElementById('d20Path');
  const dot = document.getElementById('d20Dot');
  const prog = document.getElementById('d20Prog');
  const off = document.getElementById('d20Off');
  const total = 900;
  ScrollTrigger.create({
    trigger: stage, start: "top top", end: "bottom bottom", scrub: true,
    onUpdate: self => {
      const t = self.progress;
      const newOff = total * (1 - t);
      path.setAttribute('stroke-dashoffset', newOff.toFixed(0));
      const pt = path.getPointAtLength(total * t);
      dot.setAttribute('cx', pt.x);
      dot.setAttribute('cy', pt.y);
      prog.textContent = (t * 100).toFixed(0) + "%";
      off.textContent = newOff.toFixed(0);
      stage.dataset.pinState = t < .08 ? "start" : (t > .92 ? "end" : "mid");
    }
  });
})();
</script>
</body>
</html>
