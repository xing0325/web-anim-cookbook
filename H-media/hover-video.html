<style>
.d10-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;padding:1rem 0}
.d10-card{position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line-soft);border-radius:4px;cursor:pointer;background:var(--bg-3)}
.d10-placeholder{position:absolute;inset:0;background:linear-gradient(135deg,#1c2218,#0a1208);display:grid;place-items:center;color:var(--lime);transition:opacity .4s var(--cubic),transform .4s var(--cubic);z-index:2}
.d10-placeholder svg{width:42px;height:42px}
.d10-placeholder .lbl{position:absolute;bottom:.5rem;left:.6rem;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.55rem;color:var(--fg-mute);letter-spacing:.15em}
.d10-card:hover .d10-placeholder{opacity:0;transform:scale(1.05)}
.d10-stream{position:absolute;inset:0;background:#070a05;display:grid;place-items:center;opacity:0;transition:opacity .4s var(--cubic);z-index:1;color:var(--lime)}
.d10-card:hover .d10-stream{opacity:1}
.d10-bars{display:flex;gap:6px;align-items:flex-end;height:64px;margin-bottom:1rem}
.d10-bars span{width:6px;height:30%;background:var(--lime);animation:bars 1.2s ease-in-out infinite;border-radius:1px}
.d10-bars span:nth-child(2){animation-delay:.1s}
.d10-bars span:nth-child(3){animation-delay:.2s}
.d10-bars span:nth-child(4){animation-delay:.3s}
.d10-bars span:nth-child(5){animation-delay:.4s}
@keyframes bars{0%,100%{height:20%}50%{height:90%}}
.d10-time{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;letter-spacing:.1em}




/* ---------- demo 10: hover video ---------- */
