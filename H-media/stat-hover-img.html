<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat hover 背景图替换 · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">

<style>
.d24-stage{position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--line-soft);background:var(--bg-3)}
.d24-bg{position:absolute;inset:0;background:transparent;opacity:0;transition:opacity .55s var(--cubic),background .55s var(--cubic);z-index:0}
.d24-stage.is-hot .d24-bg{opacity:.85}
.d24-grid{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft);z-index:1}
.d24-stat{padding:2rem 1.5rem;background:var(--bg-3);cursor:pointer;transition:background .35s,color .35s}
.d24-stat:hover{background:rgba(0,0,0,.4)}
.d24-num{font-size:clamp(2rem,5vw,3.5rem);font-weight:200;color:var(--lime);line-height:1;margin-bottom:.5rem;letter-spacing:-.02em}
.d24-lbl{font-size:.65rem;letter-spacing:.25em;color:var(--fg-dim);text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace}
@media(max-width:600px){.d24-grid{grid-template-columns:1fr}}




/* ---------- demo 22 (Rive buttons) · d23- ---------- */
.d23-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;padding:1rem 0}

.d23-btn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1.1rem 1.25rem;border:1px solid var(--lime);background:transparent;color:var(--lime);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;border-radius:999px;cursor:pointer;overflow:hidden;font-family:'JetBrains Mono',ui-monospace,monospace;transition:transform .35s var(--cubic),background .35s var(--cubic),color .35s var(--cubic)}

.d23-icon{width:1.4rem;height:1.4rem;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;flex-shrink:0;transition:transform .45s var(--cubic),background .35s,color .35s}

.d23-icon svg{width:.7rem;height:.7rem}

.d23-rotate:hover .d23-icon{transform:rotate(-90deg);background:var(--lime);color:#0a0e07}

.d23-invert:hover{background:var(--lime);color:#0a0e07}

.d23-invert:hover .d23-icon{background:#0a0e07;color:var(--lime)}

.d23-scale:hover{transform:scale(1.06)}

.d23-scale:hover .d23-icon{transform:scale(1.3);background:var(--lime);color:#0a0e07}

.d23-shake:hover .d23-icon{animation:d23Shake .45s linear infinite}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">H-media</div>
    <h1 class="cb-title">Stat hover 背景图替换</h1>
    <div class="cb-tags">mouseenter + bg fade</div>
  </div>
</header>
<main class="cb-stage">
<div class="d24-stage" id="d24Stage">
          <div class="d24-bg" id="d24Bg"></div>
          <div class="d24-grid">
            <div class="d24-stat" data-stat-hover-img="pole" data-bg="linear-gradient(135deg,#d2ff00 0%,#5a7d00 100%)"><div class="d24-num">28</div><div class="d24-lbl">POLE POSITIONS</div></div>
            <div class="d24-stat" data-stat-hover-img="podiums" data-bg="linear-gradient(135deg,#7a9100,#0d1109)"><div class="d24-num">42</div><div class="d24-lbl">PODIUMS</div></div>
            <div class="d24-stat" data-stat-hover-img="laps" data-bg="linear-gradient(135deg,#0a1208,#1c2218)"><div class="d24-num">8K+</div><div class="d24-lbl">FASTEST LAPS</div></div>
            <div class="d24-stat" data-stat-hover-img="wins" data-bg="radial-gradient(circle at 30% 40%,#d2ff00,#3a4500)"><div class="d24-num">19</div><div class="d24-lbl">RACE WINS</div></div>
          </div>
        </div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo23</code></div>
</footer>
<script>
/* =================== DEMO 23 (Stat hover img) · d24- ============ */
(function(){
  const stage = document.getElementById('d24Stage');
  if (!stage) return;
  const bg = document.getElementById('d24Bg');
  stage.querySelectorAll('.d24-stat').forEach(s => {
    s.addEventListener('mouseenter', () => {
      stage.classList.add('is-hot');
      bg.style.background = s.dataset.bg;
    });
    s.addEventListener('mouseleave', () => {
      stage.classList.remove('is-hot');
    });
  });
})();
</script>
</body>
</html>
