.d19-card.swap{opacity:0;transform:translateY(8px)}
.d19-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.d19-flag{font-size:1.6rem;line-height:1}
.d19-id{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.7rem;letter-spacing:.2em;color:var(--lime)}
.d19-name{font-size:1.6rem;font-weight:300;letter-spacing:-.01em;line-height:1;margin-bottom:1.25rem}
.d19-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:1.5rem;border-top:1px solid var(--line-soft);padding-top:1rem}
.d19-cell .d19-k{font-size:.55rem;letter-spacing:.25em;color:var(--fg-mute);text-transform:uppercase;margin-bottom:.2rem;font-family:'JetBrains Mono',ui-monospace,monospace}
.d19-cell .d19-v{font-size:.95rem;color:var(--fg);font-weight:500}
.d19-schedule{border-top:1px solid var(--line-soft);padding-top:1rem;display:flex;flex-direction:column;gap:.4rem}
.d19-srow{display:flex;justify-content:space-between;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.78rem}
.d19-srow-k{color:var(--fg-mute);letter-spacing:.15em}
.d19-srow-v{color:var(--fg)}
.d19-srow-race{margin-top:.4rem;padding-top:.4rem;border-top:1px dashed var(--line-soft)}
.d19-srow-race .d19-srow-k{color:var(--lime);font-weight:600}
.d19-srow-race .d19-srow-v{color:var(--lime);font-weight:600}
.d19-controls{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.25rem}
.d19-btn{flex:1;font-size:.7rem}



.d20-stage{position:relative;height:320vh;background:linear-gradient(to bottom,var(--bg-2),var(--bg-3))}
.d20-pin{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2rem;padding:2rem}
.d20-svg{width:min(600px,90%);height:auto;display:block}
.d20-info{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;display:flex;flex-direction:column;gap:.4rem;min-width:300px;max-width:90%}

    { id:"02 / 24", name:"Saudi Arabian GP", flag:"🇸🇦", circuit:"Jeddah Corniche", len:"6.174 km", laps:50, dist:"308 km", p1:"Thu 16:30", p2:"Thu 20:00", p3:"Fri 16:30", q:"Fri 20:00", r:"Sat 20:00" },
    { id:"03 / 24", name:"Australian GP", flag:"🇦🇺", circuit:"Albert Park", len:"5.278 km", laps:58, dist:"306 km", p1:"Fri 12:30", p2:"Fri 16:00", p3:"Sat 12:30", q:"Sat 16:00", r:"Sun 15:00" },
    { id:"04 / 24", name:"Monaco GP", flag:"🇲🇨", circuit:"Circuit de Monaco", len:"3.337 km", laps:78, dist:"260 km", p1:"Fri 13:30", p2:"Fri 17:00", p3:"Sat 12:30", q:"Sat 16:00", r:"Sun 15:00" },
    { id:"05 / 24", name:"Canadian GP", flag:"🇨🇦", circuit:"Circuit Gilles Villeneuve", len:"4.361 km", laps:70, dist:"305 km", p1:"Fri 13:30", p2:"Fri 17:00", p3:"Sat 12:30", q:"Sat 16:00", r:"Sun 14:00" },
    { id:"06 / 24", name:"British GP", flag:"🇬🇧", circuit:"Silverstone", len:"5.891 km", laps:52, dist:"306 km", p1:"Fri 12:30", p2:"Fri 16:00", p3:"Sat 11:30", q:"Sat 15:00", r:"Sun 15:00" },
    { id:"07 / 24", name:"Japanese GP", flag:"🇯🇵", circuit:"Suzuka", len:"5.807 km", laps:53, dist:"307 km", p1:"Fri 11:30", p2:"Fri 15:00", p3:"Sat 11:30", q:"Sat 15:00", r:"Sun 14:00" },
  ];
  let i = 2; // monaco
  const card = document.getElementById('d19Card');
  function render(){
    const r = races[i];
    document.getElementById('d19Flag').textContent = r.flag;
    document.getElementById('d19Id').textContent = r.id;
    document.getElementById('d19Name').textContent = r.name;
    document.getElementById('d19Circuit').textContent = r.circuit;
    document.getElementById('d19Len').textContent = r.len;
    document.getElementById('d19Laps').textContent = r.laps;
    document.getElementById('d19Dist').textContent = r.dist;
    document.getElementById('d19P1').textContent = r.p1;
    document.getElementById('d19P2').textContent = r.p2;
    document.getElementById('d19P3').textContent = r.p3;
    document.getElementById('d19Q').textContent = r.q;
    document.getElementById('d19R').textContent = r.r;
  }
  function go(delta){
    card.classList.add('swap');
    setTimeout(() => {
      i = (i + delta + races.length) % races.length;
      render();
      card.classList.remove('swap');
    }, 250);
  }
  document.querySelectorAll('[data-cal-control]').forEach(b => {
    b.addEventListener('click', () => go(b.dataset.calControl === 'next-item' ? 1 : -1));
  });
})();

(function renderTaxonomy(){
  const grid = document.getElementById('taxonomyGrid');
  const summary = document.getElementById('taxSummary');
  if (!grid || !summary) return;
  function demoNum(demoId){
    const el = document.querySelector('#' + demoId + ' .num');
    if (!el) return '';
    const m = /^(\d+)/.exec(el.textContent.trim());
    return m ? m[1] : '';
  }
  function isDone(i){ return !!(i.d || i.extra); }
  function renderItems(items){
    return items.map(i => {
      const done = isDone(i);
      let numHtml = '';
      if (i.d) {
        const n = demoNum(i.d);
        if (n) numHtml = `<span class="tax-num"><a href="#${i.d}">#${n}</a></span>`;
      } else if (i.extra) {
        numHtml = `<span class="tax-num tax-extra">· ${i.extra}</span>`;
      }
      return `<div class="tax-item ${done?'is-done':''}">
        <span class="tax-check">${done?'✓':'☐'}</span>
        <span class="tax-name">${i.l}</span>
        ${numHtml}
      </div>`;
    }).join('');
  }
  function catStats(c){
    if (c.subgroups){
      let d=0,t=0;
      c.subgroups.forEach(sg => { d += sg.items.filter(isDone).length; t += sg.items.length; });
      return { d, t };
    }
    return { d: c.items.filter(isDone).length, t: c.items.length };
  }
  function catBody(c){
    if (c.subgroups){
      return c.subgroups.map(sg => {
        const d = sg.items.filter(isDone).length;
        return `<div class="tax-subgroup">
          <div class="tax-subgroup-head"><span>${sg.name}</span><span class="sg-ratio"><strong>${d}</strong> / ${sg.items.length}</span></div>
          ${renderItems(sg.items)}
        </div>`;
      }).join('');
    }
    return renderItems(c.items);
  }
  let total = 0, done = 0;
  let summaryHtml = '';
  let gridHtml = '';
  TAXONOMY.forEach(c => {
    const s = catStats(c);
    total += s.t; done += s.d;
    summaryHtml += `<div class="tax-summary-cell"><div class="key">${c.key}</div><div class="name">${c.name}</div><div class="ratio"><strong>${s.d}</strong> / ${s.t}</div></div>`;
    gridHtml += `<div class="tax-cat">
      <div class="tax-cat-head">
        <span class="tax-cat-key">${c.key}</span>
        <span class="tax-cat-name">${c.name}</span>
        <span class="tax-cat-ratio"><strong>${s.d}</strong> / ${s.t}</span>
      </div>
      ${catBody(c)}
    </div>`;
  });
  const pct = Math.round(done / total * 100);
  summary.innerHTML = `<div class="tax-summary-cell tax-total"><div class="key">${done}</div><div class="name">已完成</div><div class="ratio"><strong>${pct}%</strong> / ${total} 总项</div></div>${summaryHtml}`;
  grid.innerHTML = gridHtml;
})();
</script>
