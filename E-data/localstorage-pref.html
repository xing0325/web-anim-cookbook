<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localStorage 持久化 · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">

<style>
/* 76 localStorage */
.d76-pref{font-size:.95rem;color:var(--fg-dim)}

.d76-pref span{color:var(--lime);font-weight:600}

.d76-hint{font-size:.65rem;letter-spacing:.2em;color:var(--fg-mute)}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">E-data</div>
    <h1 class="cb-title">localStorage 持久化</h1>
    <div class="cb-tags">key/value · 刷新依然记得</div>
  </div>
</header>
<main class="cb-stage">
<div class="dmb-stage" style="flex-direction:column;gap:1rem"><div class="d76-pref" id="d76Pref">当前偏好: <span class="mono" id="d76Out">—</span></div><div style="display:flex;gap:.5rem"><button class="btn" data-pref="dark">Dark</button><button class="btn" data-pref="light">Light</button><button class="btn" data-pref="auto">Auto</button></div><div class="d76-hint mono">刷新页面看是否记住</div></div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo76</code></div>
</footer>
<script>
// 76 localStorage
(function(){
  const out = document.getElementById('d76Out');
  const pref = document.getElementById('d76Pref');
  if(!out||!pref) return;
  const KEY = 'cookbook-d76-pref';
  const saved = localStorage.getItem(KEY) || '—';
  out.textContent = saved;
  pref.parentElement.querySelectorAll('[data-pref]').forEach(b => {
    b.addEventListener('click', () => {
      const v = b.dataset.pref;
      localStorage.setItem(KEY, v);
      out.textContent = v;
    });
  });
})();
</script>
</body>
</html>
