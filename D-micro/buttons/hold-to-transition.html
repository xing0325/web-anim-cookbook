/* =================== DEMO 30 · hold-to-transition === */
(function(){
  const btn = document.getElementById('d30Btn');
  const txt = document.getElementById('d30Txt');
  const status = document.getElementById('d30Status');
  if(!btn) return;
  let timer = null;
  function start(e){
    if (e) e.preventDefault();
    if (btn.classList.contains('done')) {
      btn.classList.remove('done');
      txt.textContent = "Hold to enter";
    }
    btn.classList.add('holding');
    status.textContent = "按住中 · 别松手 · 0.6s";
    timer = setTimeout(() => {
      btn.classList.remove('holding');
      btn.classList.add('done');
      txt.textContent = "✓ Entered";
      status.textContent = "触发成功 · hold-to-confirm 完成";
      timer = null;
    }, 600);
  }
  function cancel(){
    if (timer) { clearTimeout(timer); timer = null;
      btn.classList.remove('holding');
      status.textContent = "取消了 · 需要按住 0.6 秒才触发";
    } else if (btn.classList.contains('holding')) {
      btn.classList.remove('holding');
    }
  }
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('mouseup', cancel);
  btn.addEventListener('mouseleave', cancel);
  btn.addEventListener('touchend', cancel);
  btn.addEventListener('touchcancel', cancel);
})();

/* =================== smooth-jump for all in-page hash links === */
(function(){
  function jumpTo(id){
    const el = document.getElementById(id);
    if (!el) return;
    const navH = (document.getElementById('nav')?.offsetHeight) || 64;
    const top = el.getBoundingClientRect().top + window.scrollY - navH - 16;
    window.scrollTo({ top, behavior: 'smooth' });
    history.replaceState(null, '', '#' + id);
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href.length < 2) return;
    const id = href.slice(1);
    // hash routes like #filter-X are handled by focusMode via hashchange
    if (id.startsWith('filter-')) {
      e.preventDefault();
      if (location.hash === href) {
        // same hash: still trigger filter logic
        if (window.__applyFilter) window.__applyFilter(id.slice(7));
      } else {
        location.hash = href;
      }
      return;
    }
    if (!document.getElementById(id)) return;
    e.preventDefault();
    jumpTo(id);
  });
})();

const CAT_NAMES = {
  entrance: {key:"A", name:"入场 & 转场"},
  scroll:   {key:"B", name:"滚动驱动"},
  nav:      {key:"C", name:"导航 & 主题"},
  micro:    {key:"D", name:"微动效"},
  data:     {key:"E", name:"数据驱动"},
  gesture:  {key:"F", name:"手势 & 光标"},
  visual:   {key:"G", name:"视觉系统"},
  media:    {key:"H", name:"媒体"}
};

(function injectPills(){
  document.querySelectorAll('.demo').forEach(d => {
    const m = CAT_MAP[d.id];
    if (!m) return;
    d.dataset.cat = m.cat;
    const pill = document.createElement('div');
    pill.className = 'cat-pill';
    pill.textContent = `${m.key} · ${m.name}`;
    const head = d.querySelector('.demo-head');
    const num = head && head.querySelector('.num');
    if (num) num.after(pill); else head && head.prepend(pill);
  });
  // also tag cat-dividers (they already have data-cat from the script)
  document.querySelectorAll('.cat-divider').forEach(d => d.classList.add('is-cat-div'));
})();

/* =================== render splash-grid dynamically from CAT_MAP === */
(function renderSplashGrid(){
  const grid = document.getElementById('splashGrid');
  if (!grid) return;
  // collect demos by category, in DOM order
  const byCat = {};
  document.querySelectorAll('.demo').forEach(d => {
    const m = CAT_MAP[d.id]; if (!m) return;
    (byCat[m.cat] = byCat[m.cat] || []).push(d);
  });
  const order = ["entrance","scroll","nav","micro","data","gesture","visual","media"];
  const subtitle = {
    entrance:"用户与页面的\"门\"",
    scroll:"把滚动条变成时间线",
    nav:"section 间的色彩切换",
    micro:"按钮 / 链接 / 字符的小动作",
    data:"CMS / 定时 / 计算",
    gesture:"鼠标 / 触屏的硬件交互",
    visual:"字体 / 布局 / 形状 / 容器",
    media:"视频 / 图片相关"
  };
  let html = "";
  order.forEach(cat => {
    const list = byCat[cat] || [];
    if (!list.length) return;
    const meta = CAT_NAMES[cat];
    // get the displayed numbers (.num textContent) of each demo
    const nums = list.map(d => {
      const t = d.querySelector('.num')?.textContent?.trim() || '';
      const m = /^(\d+)/.exec(t);
      return m ? m[1] : '';
    }).filter(Boolean);
    html += `<a class="splash-card splash-jump reveal" href="#filter-${cat}" data-cat="${cat}">
      <div class="splash-card-head"><div class="splash-card-key">${meta.key}</div><div class="splash-card-name">${meta.name}</div></div>
      <div class="splash-card-meta">${subtitle[cat]} · <strong>${list.length}</strong> demos</div>
      <div class="splash-card-list">${nums.map(n => `<span>${n}</span>`).join('')}</div>
    </a>`;
  });
  grid.innerHTML = html;
})();

/* =================== focus mode (filter by category) === */
(function focusMode(){
  const filterBar = document.getElementById('filterBar');
  const filterKey = document.getElementById('filterKey');
  const filterName = document.getElementById('filterName');
  const filterCount = document.getElementById('filterCount');
  const filterBack = document.getElementById('filterBack');

  function applyFilter(cat){
    const meta = CAT_NAMES[cat];
    if (!meta) return clearFilter();
    document.body.dataset.filter = cat;
    let count = 0;
    document.querySelectorAll('.demo').forEach(d => {
      const isActive = d.dataset.cat === cat;
      d.classList.toggle('is-active', isActive);
      if (isActive) count++;
    });
    document.querySelectorAll('.cat-divider').forEach(d => {
      d.classList.toggle('is-active', d.dataset.cat === cat);
    });
    document.querySelectorAll('.splash-card').forEach(c => {
      c.classList.toggle('is-active', c.dataset.cat === cat);
    });
    filterKey.textContent = meta.key;
    filterName.textContent = meta.name;
    filterCount.textContent = `· ${count} demos`;
    // scroll to the active divider after a tick (DOM has hidden others)
    requestAnimationFrame(() => {
      const div = document.querySelector('.cat-divider.is-active');
      if (div) {
        const navH = (document.getElementById('nav')?.offsetHeight) || 64;
        const top = div.getBoundingClientRect().top + window.scrollY - navH - 16;
        window.scrollTo({ top, behavior: 'smooth' });
      }
      try { ScrollTrigger && ScrollTrigger.refresh(); } catch(e){}
    });
  }

  function clearFilter(){
    delete document.body.dataset.filter;
    document.querySelectorAll('.demo.is-active, .cat-divider.is-active, .splash-card.is-active')
      .forEach(el => el.classList.remove('is-active'));
    history.replaceState(null, '', location.pathname + location.search);
    try { ScrollTrigger && ScrollTrigger.refresh(); } catch(e){}
  }

  function handleHash(){
    const h = location.hash;
    const m = /^#filter-([a-z]+)$/.exec(h);
    if (m && CAT_NAMES[m[1]]) {
      applyFilter(m[1]);
    } else {
      // hash is something else (or empty) → exit filter
      if (document.body.dataset.filter && (!h || !h.startsWith('#filter-'))) {
        clearFilter();
      }
    }
  }

  filterBack.addEventListener('click', () => {
    clearFilter();
    // scroll back to splash
    const splash = document.querySelector('.splash');
    if (splash) {
      const navH = (document.getElementById('nav')?.offsetHeight) || 64;
      const top = splash.getBoundingClientRect().top + window.scrollY - navH - 16;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  });

  window.addEventListener('hashchange', handleHash);
  window.__applyFilter = applyFilter;
  window.__clearFilter = clearFilter;
  // initial check
  setTimeout(handleHash, 200);
})();
