<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>按钮 ripple 涟漪 · web-anim-cookbook</title>
<link rel="stylesheet" href="../../_shared/base.css">

<style>
/* 31 ripple */
.d31-btn{position:relative;overflow:hidden;padding:1rem 2rem;border:1px solid var(--lime);background:transparent;color:var(--lime);border-radius:999px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}

.d31-btn .ripple{position:absolute;border-radius:50%;background:rgba(208,255,0,.4);transform:translate(-50%,-50%) scale(0);animation:d31R .7s ease-out forwards;pointer-events:none}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">D-micro/buttons</div>
    <h1 class="cb-title">按钮 ripple 涟漪</h1>
    <div class="cb-tags">click 位置 · scale + opacity</div>
  </div>
</header>
<main class="cb-stage">
<div class="dmb-stage"><button class="d31-btn" id="d31Btn">Click anywhere on me</button></div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo31</code></div>
</footer>
<script>
// 31 ripple
(function(){
  const btn = document.getElementById('d31Btn');
  if (!btn) return;
  btn.addEventListener('click', e => {
    const r = btn.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const rip = document.createElement('span');
    rip.className = 'ripple';
    rip.style.left = x + 'px';
    rip.style.top = y + 'px';
    rip.style.width = rip.style.height = Math.max(r.width, r.height) + 'px';
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 700);
  });
})();
</script>
</body>
</html>
