<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>按钮 disabled 平滑过渡 · web-anim-cookbook</title>
<link rel="stylesheet" href="../../_shared/base.css">

<style>
/* 37 disabled */
.d37-en{font-size:.7rem;letter-spacing:.15em;color:var(--fg-dim)}

.d37-btn{padding:1rem 2.2rem;border:1px solid var(--lime);background:transparent;color:var(--lime);border-radius:999px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;transition:opacity .45s var(--cubic),filter .45s var(--cubic),cursor 0s}

.d37-btn[disabled]{opacity:.35;filter:grayscale(1);cursor:not-allowed}

.d37-btn:not([disabled]){opacity:1;filter:none;cursor:pointer}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">D-micro/buttons</div>
    <h1 class="cb-title">按钮 disabled 平滑过渡</h1>
    <div class="cb-tags">checkbox 切换 · opacity + filter</div>
  </div>
</header>
<main class="cb-stage">
<div class="dmb-stage" style="flex-direction:column;gap:1rem;display:flex;align-items:center"><label class="d37-en"><input type="checkbox" id="d37Toggle"> Enable button</label><button class="d37-btn" id="d37Btn" disabled>Continue</button></div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo37</code></div>
</footer>
<script>
// 37 disabled toggle
(function(){
  const tog = document.getElementById('d37Toggle');
  const btn = document.getElementById('d37Btn');
  if (!tog || !btn) return;
  tog.addEventListener('change', () => {
    if (tog.checked) btn.removeAttribute('disabled'); else btn.setAttribute('disabled', '');
  });
})();
</script>
</body>
</html>
