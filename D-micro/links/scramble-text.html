<body class="cookbook-page">

    <h1 class="cb-title">Glitch / Scramble 字符替换</h1>
    <div class="cb-tags">随机字符 · 24 帧揭示</div>
  </div>
</header>
<main class="cb-stage">
<div class="dmb-stage" style="flex-direction:column"><div class="d41-out" id="d41Out">LANDO NORRIS</div><button class="btn" id="d41Btn" style="margin-top:1.5rem">↻ Scramble</button></div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo41</code></div>
</footer>
<script>
// 41 scramble
(function(){
  const out = document.getElementById('d41Out');
  const btn = document.getElementById('d41Btn');
  if (!out || !btn) return;
  const target = out.textContent;
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%&*";
  let timer = null;
  function run(){
    if (timer) clearInterval(timer);
    let frame = 0;
    const total = 24;
    timer = setInterval(() => {
      frame++;
      const reveal = Math.floor((frame / total) * target.length);
      out.textContent = target.split('').map((c, i) => {
        if (c === ' ') return ' ';
        if (i < reveal) return c;
        return chars[Math.floor(Math.random() * chars.length)];
      }).join('');
      if (frame >= total) { clearInterval(timer); out.textContent = target; }
    }, 50);
  }
  btn.addEventListener('click', run);
})();
</script>
</body>
</html>
