/* 39 cube flip */
.d39-link{position:relative;display:inline-block;height:1.4em;perspective:600px;cursor:pointer;font-size:1.1rem;line-height:1.4em;width:7em;text-align:center}

.d39-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;color:var(--fg);transition:transform .55s var(--cubic),color .35s}

.d39-back{transform:rotateX(-90deg) translateZ(.7em);color:var(--lime)}

.d39-link .d39-face:not(.d39-back){transform-origin:bottom}

.d39-link:hover .d39-face:not(.d39-back){transform:rotateX(90deg) translateZ(.7em)}

.d39-link:hover .d39-back{transform:rotateX(0deg) translateZ(0)}
</style>
