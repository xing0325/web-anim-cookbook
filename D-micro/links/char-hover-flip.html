.d18-clip{display:inline-block;overflow:hidden;line-height:1.1;position:relative;height:1.1em}
.d18-row{display:block;transition:transform .55s var(--cubic);will-change:transform}
.d18-row span{display:inline-block;transition:transform .55s var(--cubic),color .35s;will-change:transform}
.d18-row-2{position:absolute;top:100%;left:0;color:var(--lime)}
.d18-link:hover .d18-row{transform:translateY(-100%)}
.d18-link:hover .d18-row-2 span,.d18-link:hover .d18-row span{transition-delay:calc(var(--i,0) * 30ms)}
.d18-link:hover .d18-row span:nth-child(1){--i:0}
.d18-link:hover .d18-row span:nth-child(2){--i:1}
.d18-link:hover .d18-row span:nth-child(3){--i:2}
.d18-link:hover .d18-row span:nth-child(4){--i:3}
.d18-link:hover .d18-row span:nth-child(5){--i:4}
