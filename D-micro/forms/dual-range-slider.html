<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dual handle range slider · web-anim-cookbook</title>
<link rel="stylesheet" href="../../_shared/base.css">

<style>
/* 50 dual range */
.d50-wrap{position:relative;height:60px}

.d50-wrap input{appearance:none;-webkit-appearance:none;width:100%;height:4px;background:transparent;position:absolute;top:25px;left:0;pointer-events:none;outline:none}

.d50-wrap input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;background:var(--lime);border-radius:50%;pointer-events:auto;cursor:grab;border:2px solid #0a0e07;position:relative;z-index:2}

.d50-track{position:absolute;top:27px;left:0;right:0;height:2px;background:var(--bg-3)}

.d50-track::before{content:"";position:absolute;left:var(--a,20%);right:calc(100% - var(--b,75%));top:0;height:100%;background:var(--lime)}

.d50-out{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:.78rem;color:var(--fg-dim);letter-spacing:.1em}

.d50-out span{color:var(--lime)}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">D-micro/forms</div>
    <h1 class="cb-title">Dual handle range slider</h1>
    <div class="cb-tags">双 input range · min/max 互锁</div>
  </div>
</header>
<main class="cb-stage">
<div class="dmb-stage" style="flex-direction:column;width:100%;max-width:480px"><div class="d50-wrap"><input type="range" min="0" max="100" value="20" id="d50A"><input type="range" min="0" max="100" value="75" id="d50B"><div class="d50-track" id="d50T"></div><div class="d50-out mono"><span id="d50OutA">20</span> — <span id="d50OutB">75</span></div></div></div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo50</code></div>
</footer>
<script>
// 50 dual range
(function(){
  const a = document.getElementById('d50A');
  const b = document.getElementById('d50B');
  const oa = document.getElementById('d50OutA');
  const ob = document.getElementById('d50OutB');
  const w = a?.closest('.d50-wrap');
  if (!a || !b || !w) return;
  function up(){
    let va = +a.value, vb = +b.value;
    if (va > vb - 5) { va = vb - 5; a.value = va; }
    if (vb < va + 5) { vb = va + 5; b.value = vb; }
    w.style.setProperty('--a', va + '%');
    w.style.setProperty('--b', vb + '%');
    oa.textContent = va;
    ob.textContent = vb;
  }
  a.addEventListener('input', up);
  b.addEventListener('input', up);
  up();
})();
</script>
</body>
</html>
