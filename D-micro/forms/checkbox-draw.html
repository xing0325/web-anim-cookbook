<style>
/* 46 checkbox */
.d46-row{display:flex;align-items:center;gap:.7rem;cursor:pointer;color:var(--fg);font-size:.95rem;user-select:none}

.d46-row input{display:none}

.d46-box{width:1.3rem;height:1.3rem;border:1.5px solid var(--lime);border-radius:4px;display:grid;place-items:center;transition:background .25s,border-color .25s}

.d46-box svg{width:80%;height:80%;display:block}

.d46-box svg path{fill:none;stroke:#0a0e07;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .35s var(--cubic) .1s}

.d46-row input:checked + .d46-box{background:var(--lime)}

.d46-row input:checked + .d46-box svg path{stroke-dashoffset:0}
</style>
</head>
