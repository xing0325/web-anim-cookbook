<style>
/* 47 toggle */
.d47-row{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;width:100%;max-width:280px;color:var(--fg);font-size:.95rem}

.d47-tg{position:relative;display:inline-block}

.d47-tg input{display:none}

.d47-track{display:block;width:3rem;height:1.5rem;background:var(--bg-3);border:1px solid var(--line-soft);border-radius:999px;position:relative;transition:background .35s,border-color .35s;cursor:pointer}

.d47-knob{position:absolute;top:1px;left:1px;width:1.3rem;height:1.3rem;background:var(--fg-mute);border-radius:50%;transition:transform .45s cubic-bezier(.5,1.6,.5,1),background .35s}

.d47-tg input:checked + .d47-track{background:var(--lime);border-color:var(--lime)}

.d47-tg input:checked + .d47-track .d47-knob{transform:translateX(1.5rem);background:#0a0e07}
</style>
</head>
