<style>
/* 51 floating label */
.d51-field{position:relative}

.d51-field input{width:100%;padding:1.5rem 1rem .5rem;border:1px solid var(--line-soft);background:var(--bg-3);color:var(--fg);border-radius:4px;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .25s}

.d51-field input:focus{border-color:var(--lime)}

.d51-field label{position:absolute;left:1rem;top:1.1rem;color:var(--fg-mute);font-size:.95rem;pointer-events:none;transition:transform .25s var(--cubic),color .25s,font-size .25s;letter-spacing:.05em}

.d51-field input:focus + label,.d51-field input:not(:placeholder-shown) + label{transform:translateY(-.85rem) scale(.78);color:var(--lime);transform-origin:left}
</style>
</head>
