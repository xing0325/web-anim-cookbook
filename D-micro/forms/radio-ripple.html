<style>
/* 48 radio */
.d48-row{display:flex;align-items:center;gap:.7rem;cursor:pointer;color:var(--fg);font-size:.95rem;user-select:none}

.d48-row input{display:none}

.d48-dot{width:1.3rem;height:1.3rem;border:1.5px solid var(--lime);border-radius:50%;display:grid;place-items:center;position:relative}

.d48-dot::before{content:"";width:.5rem;height:.5rem;background:var(--lime);border-radius:50%;transform:scale(0);transition:transform .4s cubic-bezier(.5,1.6,.5,1)}

.d48-dot::after{content:"";position:absolute;inset:-2px;border:1px solid var(--lime);border-radius:50%;opacity:0;transform:scale(.6)}

.d48-row input:checked + .d48-dot::before{transform:scale(1)}

.d48-row input:checked + .d48-dot::after{animation:d48R .7s ease-out forwards}
</style>
</head>
