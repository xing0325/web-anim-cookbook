<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid morph blob · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">

<style>
/* 86 liquid blob */
.d86-svg{width:240px;height:240px}

.d86-svg path{transition:d 2s cubic-bezier(.4,0,.2,1)}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">G-visual</div>
    <h1 class="cb-title">Liquid morph blob</h1>
    <div class="cb-tags">SVG path · 周期性变形</div>
  </div>
</header>
<main class="cb-stage">
<div class="dmb-stage"><svg class="d86-svg" viewBox="0 0 200 200"><path id="d86Path" fill="#d2ff00"/></svg></div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo86</code></div>
</footer>
<script>
// 86 liquid blob
(function(){
  const path = document.getElementById('d86Path');
  if(!path) return;
  function gen(){
    const cx = 100, cy = 100;
    const n = 8;
    const pts = [];
    for(let i = 0; i < n; i++){
      const a = (Math.PI*2/n) * i;
      const r = 60 + Math.random() * 30;
      pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]);
    }
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
    for(let i = 1; i <= n; i++){
      const p0 = pts[(i-1) % n], p1 = pts[i % n];
      const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
      d += `Q ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)} `;
    }
    d += 'Z';
    return d;
  }
  path.setAttribute('d', gen());
  setInterval(() => path.setAttribute('d', gen()), 2000);
})();
</script>
</body>
</html>
