<style>
.d16-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;padding:1rem 0}
.d16-card{position:relative}
.d16-mask{aspect-ratio:1;background:linear-gradient(135deg,#0a1208,var(--bg-3));border:1px solid var(--line-soft)}
.d16-card[data-mask="a"] .d16-mask{-webkit-mask:radial-gradient(circle 28px at 0% 50%,transparent 27px,#000 28px);mask:radial-gradient(circle 28px at 0% 50%,transparent 27px,#000 28px)}
.d16-card[data-mask="b"] .d16-mask{-webkit-mask:radial-gradient(circle 28px at 100% 50%,transparent 27px,#000 28px);mask:radial-gradient(circle 28px at 100% 50%,transparent 27px,#000 28px)}
.d16-card[data-mask="c"] .d16-mask{-webkit-mask:linear-gradient(135deg,transparent 40px,#000 41px);mask:linear-gradient(135deg,transparent 40px,#000 41px)}
.d16-card[data-mask="d"] .d16-mask{-webkit-mask:linear-gradient(-135deg,transparent 40px,#000 41px);mask:linear-gradient(-135deg,transparent 40px,#000 41px)}
.d16-card{background:none}
.d16-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:1.25rem;color:var(--lime);font-weight:500;letter-spacing:.05em}
.d16-content span{font-size:.65rem;letter-spacing:.3em;color:var(--fg-mute);margin-bottom:.35rem;font-family:'JetBrains Mono',ui-monospace,monospace}
.d16-tag{position:absolute;top:.5rem;left:.5rem;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-mute);font-family:'JetBrains Mono',ui-monospace,monospace;background:rgba(0,0,0,.5);padding:.2rem .5rem;border-radius:3px}




/* ---------- demo 16: SVG mask shapes ---------- */
