<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variable Font 双轴 · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">

<style>
.d21-stage{padding:2rem 0;text-align:center}
.d21-preview{font-family:"Mona Sans","Inter",sans-serif;font-size:clamp(2.8rem,8vw,6rem);line-height:1;letter-spacing:-.01em;color:var(--lime);transition:font-variation-settings .15s linear,letter-spacing .2s;margin-bottom:2rem}
.d21-controls{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.d21-controls label{display:flex;flex-direction:column;gap:.5rem;font-size:.65rem;letter-spacing:.25em;color:var(--fg-dim);text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace;min-width:200px}
.d21-controls label span{color:var(--lime);font-weight:600}
.d21-controls input{accent-color:var(--lime);width:100%}
.d21-readout{font-size:.78rem;color:var(--fg-dim);padding:.75rem;background:#070a05;border:1px solid var(--line-soft);border-radius:4px;display:inline-block}
.d21-readout span{color:var(--lime)}




/* ---------- demo 19 (Rive scrub SVG draw) · d20- ---------- */
.d20-stage{position:relative;height:320vh;background:linear-gradient(to bottom,var(--bg-2),var(--bg-3))}

.d20-pin{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2rem;padding:2rem}

.d20-svg{width:min(600px,90%);height:auto;display:block}

.d20-info{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;display:flex;flex-direction:column;gap:.4rem;min-width:300px;max-width:90%}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">G-visual</div>
    <h1 class="cb-title">Variable Font 双轴</h1>
    <div class="cb-tags">font-variation-settings</div>
  </div>
</header>
<main class="cb-stage">
<div class="d21-stage">
          <div class="d21-preview" id="d21Preview" style="font-variation-settings:'wght' 400,'wdth' 100">LANDO NORRIS</div>
          <div class="d21-controls">
            <label>weight <span id="d21WghtVal">400</span><input type="range" id="d21Wght" min="200" max="900" value="400"></label>
            <label>width <span id="d21WdthVal">100</span><input type="range" id="d21Wdth" min="75" max="125" value="100"></label>
          </div>
          <div class="d21-readout mono">font-variation-settings: 'wght' <span id="d21Out1">400</span>, 'wdth' <span id="d21Out2">100</span></div>
        </div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo20</code></div>
</footer>
<script>
/* =================== DEMO 20 (Variable Font) · d21- ============ */
(function(){
  const wght = document.getElementById('d21Wght');
  const wdth = document.getElementById('d21Wdth');
  const wghtVal = document.getElementById('d21WghtVal');
  const wdthVal = document.getElementById('d21WdthVal');
  const out1 = document.getElementById('d21Out1');
  const out2 = document.getElementById('d21Out2');
  const preview = document.getElementById('d21Preview');
  function update(){
    const w = wght.value, d = wdth.value;
    preview.style.fontVariationSettings = `'wght' ${w}, 'wdth' ${d}`;
    wghtVal.textContent = w;
    wdthVal.textContent = d;
    out1.textContent = w;
    out2.textContent = d;
  }
  wght.addEventListener('input', update);
  wdth.addEventListener('input', update);
})();
</script>
</body>
</html>
