<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>椭圆轨迹大字 · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">

<style>
.d13-stage{padding:2rem 0;text-align:center;position:relative;min-height:300px}
.d13-arc{position:relative;height:200px;display:flex;justify-content:center;align-items:flex-end}
.d13-arc-char{position:absolute;font-size:clamp(2rem,4.5vw,3.4rem);font-weight:300;color:var(--lime);line-height:1;transform-origin:50% 280px;letter-spacing:.05em;transition:transform .35s var(--cubic),transform-origin .35s var(--cubic)}
.d13-controls{margin-top:2rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.d13-controls label{display:flex;align-items:center;gap:.5rem;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-dim)}
.d13-controls input{accent-color:var(--lime)}




/* ---------- demo 13: oval-scroll arc ---------- */
.d13-stage{padding:2rem 0;text-align:center;position:relative;min-height:300px}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">G-visual</div>
    <h1 class="cb-title">椭圆轨迹大字</h1>
    <div class="cb-tags">transform-origin · 字符 rotate</div>
  </div>
</header>
<main class="cb-stage">
<div class="d13-stage">
          <div class="d13-arc" id="d13Arc">
            <div class="d13-arc-char" data-oval-scroll>O</div><div class="d13-arc-char" data-oval-scroll>F</div><div class="d13-arc-char" data-oval-scroll>F</div><div class="d13-arc-char" data-oval-scroll>T</div><div class="d13-arc-char" data-oval-scroll>R</div><div class="d13-arc-char" data-oval-scroll>A</div><div class="d13-arc-char" data-oval-scroll>C</div><div class="d13-arc-char" data-oval-scroll>K</div>
          </div>
          <div class="d13-controls">
            <label>弧度 <input type="range" id="d13Curve" min="20" max="160" value="80"></label>
            <label>半径 <input type="range" id="d13Radius" min="180" max="420" value="280"></label>
          </div>
        </div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo13</code></div>
</footer>
<script>
/* =================== DEMO 13 · oval arc layout === */
(function(){
  const arc = document.getElementById('d13Arc');
  const chars = arc.querySelectorAll('.d13-arc-char');
  const curveInput = document.getElementById('d13Curve');
  const radiusInput = document.getElementById('d13Radius');
  function layout(){
    const totalDeg = parseFloat(curveInput.value);
    const radius = parseFloat(radiusInput.value);
    const n = chars.length;
    const step = totalDeg / (n - 1);
    chars.forEach((c,i) => {
      const deg = -totalDeg/2 + step*i;
      c.style.transformOrigin = `50% ${radius}px`;
      c.style.transform = `translateX(-50%) rotate(${deg}deg)`;
      c.style.left = "50%";
      c.style.bottom = "0";
    });
  }
  layout();
  curveInput.addEventListener('input', layout);
  radiusInput.addEventListener('input', layout);
  window.addEventListener('resize', layout);
})();
</script>
</body>
</html>
