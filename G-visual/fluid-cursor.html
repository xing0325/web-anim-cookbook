<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鼠标驱动流体位移 · 仿原版头盔 · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">

<style>
/* demo 90 · fluid cursor */
.d90-stage{position:relative;height:380px;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;cursor:none;background:linear-gradient(135deg,#0a1208,#1c2218)}

.d90-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.d90-cur{position:absolute;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--lime);mix-blend-mode:difference;pointer-events:none;transform:translate(-50%,-50%);opacity:.7;transition:opacity .25s}

.d90-stage:not(:hover) .d90-cur{opacity:.35}

.d90-hint{position:absolute;left:1rem;bottom:1rem;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.65rem;color:var(--fg-mute);letter-spacing:.2em;pointer-events:none}

.d90-state{position:absolute;right:1rem;top:1rem;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.65rem;color:var(--lime);letter-spacing:.15em;pointer-events:none;background:rgba(10,14,7,.7);padding:.35rem .6rem;border-radius:3px;border:1px solid var(--line-soft)}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">G-visual</div>
    <h1 class="cb-title">鼠标驱动流体位移 · 仿原版头盔</h1>
    <div class="cb-tags">SVG feTurbulence + feDisplacementMap · idle Lissajous</div>
  </div>
</header>
<main class="cb-stage">
<div class="d90-stage" id="d90Stage">
          <svg class="d90-svg" viewBox="0 0 400 380" preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="d90Fluid" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence id="d90Turb" type="fractalNoise" baseFrequency="0.014 0.018" numOctaves="2" seed="3" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
              <linearGradient id="d90G" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#d2ff00"/>
                <stop offset="1" stop-color="#5a7d00"/>
              </linearGradient>
            </defs>
            <g filter="url(#d90Fluid)" transform="translate(200 190)">
              <!-- 头盔轮廓 -->
              <ellipse cx="0" cy="-15" rx="110" ry="120" fill="url(#d90G)"/>
              <path d="M-108 30 Q-108 70 -65 90 L65 90 Q108 70 108 30 Z" fill="url(#d90G)" opacity=".85"/>
              <path d="M-82 -40 Q-86 25 -72 50 L72 50 Q86 25 82 -40 Q64 -55 0 -55 Q-64 -55 -82 -40 Z" fill="#0a0e07" opacity=".85"/>
              <path d="M-58 -28 Q-40 -42 -12 -42" stroke="#fff" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>
              <rect x="-108" y="-6" width="216" height="3" fill="#0a0e07" opacity=".4"/>
            </g>
          </svg>
          <div class="d90-cur" id="d90Cur"></div>
          <div class="d90-hint">移开鼠标 2.5s · 自动游走</div>
          <div class="d90-state" id="d90State">MODE · idle</div>
        </div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo90</code></div>
</footer>
<script>
// 89 before/after
(function(){
  const stage = document.getElementById('d89Stage');
  const before = document.getElementById('d89Before');
  const handle = document.getElementById('d89Handle');
  if(!stage||!before||!handle) return;
  let dragging = false;
  function setX(clientX){
    const r = stage.getBoundingClientRect();
    let pct = (clientX - r.left) / r.width * 100;
    pct = Math.max(0, Math.min(100, pct));
    before.style.clipPath = `inset(0 ${100-pct}% 0 0)`;
    handle.style.left = pct + '%';
  }
  stage.addEventListener('mousedown', e => { dragging = true; setX(e.clientX); });
  window.addEventListener('mousemove', e => { if(dragging) setX(e.clientX); });
  window.addEventListener('mouseup', () => dragging = false);
  stage.addEventListener('touchstart', e => { dragging = true; setX(e.touches[0].clientX); }, {passive:true});
  stage.addEventListener('touchmove', e => { if(dragging) setX(e.touches[0].clientX); }, {passive:true});
  stage.addEventListener('touchend', () => dragging = false);
})();


/* demo 90 · fluid cursor displacement */
(function(){
  const stage = document.getElementById('d90Stage');
  const turb = document.getElementById('d90Turb');
  const cur = document.getElementById('d90Cur');
  const state = document.getElementById('d90State');
  if (!stage || !turb) return;

  let mouseX = 0.5, mouseY = 0.5;
  let curX = 0.5, curY = 0.5;
  let lastMove = 0;
  let idleT = 0;
  let isIdle = true;

  stage.addEventListener('mousemove', e => {
    const r = stage.getBoundingClientRect();
    mouseX = (e.clientX - r.left) / r.width;
    mouseY = (e.clientY - r.top) / r.height;
    lastMove = performance.now();
    isIdle = false;
  });
  stage.addEventListener('mouseleave', () => {
    lastMove = 0;
    isIdle = true;
  });
  stage.addEventListener('touchmove', e => {
    if (!e.touches[0]) return;
    const r = stage.getBoundingClientRect();
    mouseX = (e.touches[0].clientX - r.left) / r.width;
    mouseY = (e.touches[0].clientY - r.top) / r.height;
    lastMove = performance.now();
    isIdle = false;
  }, { passive: true });

  function tick(){
    // idle detection · 2500ms = 2.5s like original
    const now = performance.now();
    if (lastMove === 0 || now - lastMove > 2500) {
      isIdle = true;
      idleT += 0.012;
      // Lissajous (matches original's progress -> idleCursor formula)
      mouseX = 0.5 + Math.cos(idleT * Math.PI * 4) * -0.4;
      mouseY = 0.5 + Math.cos(idleT * Math.PI) * 0.35;
    }
    // ease the cursor toward mouse
    curX += (mouseX - curX) * 0.15;
    curY += (mouseY - curY) * 0.15;
    // map to baseFrequency offset (creates directional flow)
    const bx = (0.008 + curX * 0.018).toFixed(4);
    const by = (0.010 + curY * 0.022).toFixed(4);
    turb.setAttribute('baseFrequency', `${bx} ${by}`);
    // animate seed for continuous flow when idle
    if (isIdle) {
      const s = (Math.floor(idleT * 60) % 12) + 2;
      turb.setAttribute('seed', s);
    }
    if (cur) {
      cur.style.left = (curX * 100) + '%';
      cur.style.top = (curY * 100) + '%';
    }
    if (state) state.textContent = isIdle ? 'MODE · idle Lissajous' : 'MODE · mouse driven';
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
