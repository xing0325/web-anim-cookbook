<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo 描线入场 · web-anim-cookbook</title>
<link rel="stylesheet" href="../_shared/base.css">

<style>
/* 67 logo draw */
.d67-svg{width:240px;height:80px}

.d67-svg path{stroke-dasharray:600;stroke-dashoffset:600;animation:d67D 2.4s var(--cubic) forwards}

.d67-svg.replay path{animation:none}
</style>
</head>
<body class="cookbook-page">
<header class="cb-head">
  <a class="cb-back" href="../README.md">← cookbook</a>
  <div class="cb-meta">
    <div class="cb-cat">A-entrance</div>
    <h1 class="cb-title">Logo 描线入场</h1>
    <div class="cb-tags">stroke-dashoffset · 进场画出</div>
  </div>
</header>
<main class="cb-stage">
<div class="dmb-stage" style="flex-direction:column;gap:1rem"><svg class="d67-svg" viewBox="0 0 200 80" id="d67Svg"><path d="M20 60 L20 20 L40 60 L40 20 M60 20 L80 20 L80 60 L60 60 Z M100 60 L100 20 L120 60 L120 20 M140 20 L160 20 L160 60 L140 60 Z M180 60 L180 20" stroke="#d2ff00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><button class="btn" id="d67Btn">↻ Replay</button></div>
</main>
<footer class="cb-foot">
  <div>Source · 反向 OFF+BRAND × Lando Norris site · <a href="https://landonorris.com" target="_blank">landonorris.com</a></div>
  <div>Demo ID: <code>demo67</code></div>
</footer>
<script>
// 67 logo draw
(function(){
  const svg = document.getElementById('d67Svg');
  const btn = document.getElementById('d67Btn');
  if(!svg||!btn) return;
  btn.addEventListener('click', () => {
    svg.classList.add('replay');
    void svg.offsetWidth;
    svg.classList.remove('replay');
  });
})();
</script>
</body>
</html>
